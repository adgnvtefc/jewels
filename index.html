<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Sort jewel groups between the board and a temporary shelf to restore your pixel artwork."><title>Little Jewel · A little love</title><link rel="icon" href="assets/art.png"><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div class="brand"><span class="brand-gem">✧</span> little jewel</div><button class="icon" id="help" aria-label="How to play">?</button></header>
<section class="heading"><div><p class="eyebrow">YOUR MOMENT OF COLOR</p><h1>A little love<span>✿</span></h1></div><button class="thumbnail" id="preview" aria-label="Preview finished artwork"><img src="assets/art.png" alt="Finished pixel artwork"><span>Preview</span></button></section>
<div class="progress-label"><span id="progressText">Put every jewel in its place.</span><strong id="percent">0%</strong></div><div class="progress-track"><div id="progress"></div></div>
<section class="board-wrap"><div id="viewport"><canvas id="board" tabindex="0" aria-label="Jewel sorting board. Tap a jewel group, then matching empty spaces or the shelf. Arrow keys move the cursor; Space selects or transfers."></canvas></div><div class="board-controls"><button id="zoomOut" aria-label="Zoom out">−</button><button id="fit" aria-label="Fit artwork">Fit</button><button id="zoomIn" aria-label="Zoom in">+</button></div><span class="board-caption">32 × 32 · MADE ONE JEWEL AT A TIME</span></section>
<div class="tools"><button id="undo" disabled><span>↶</span>Undo</button><p id="instruction" role="status">Tap a jewel group, then the shelf.</p><button id="hint"><span>✧</span>Hint</button></div>
<section class="tray"><div class="tray-heading"><span>YOUR SHELF</span><span id="shelfCount">24 spaces free</span></div><div id="shelf" aria-label="Temporary jewel shelf"></div><div class="selection-status"><p class="shelf-note" id="shelfNote">A little room to make your next move.</p><button id="clearSelection" hidden>Clear selection</button></div><button id="addShelf" class="add-shelf">+ Add shelf space <span>8 more slots</span></button><div class="tray-footer"><span><i></i><span id="saveStatus">Progress saved on this device</span></span><button id="restart">Restart puzzle</button></div></section>
</main><dialog id="modal"><button class="close icon" id="close" aria-label="Close dialog">×</button><div id="modalContent"></div></dialog><script type="module" src="app.js"></script></body></html>
