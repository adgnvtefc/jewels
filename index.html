<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Sort jewel groups between the board and a temporary shelf to restore your pixel artwork.">
  <title>Little Jewel</title>
  <link rel="icon" href="assets/art.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="Little Jewel">
    <section class="board-wrap" aria-label="Puzzle">
      <div id="viewport"><canvas id="board" tabindex="0" aria-label="Jewel sorting board. Tap a jewel group, then matching empty spaces or the shelf. Arrow keys move the cursor; Space selects or transfers."></canvas></div>
    </section>
    <p id="instruction" class="sr-only" role="status">Tap a jewel group, then the shelf.</p>
    <section class="tray" aria-label="Jewel storage">
      <div id="shelf" aria-label="Temporary jewel shelf"></div>
      <button id="addShelf" class="add-shelf">+ Add shelf space</button>
    </section>
  </main>
  <dialog id="modal"><button class="close" id="close" aria-label="Close dialog">×</button><div id="modalContent"></div></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
